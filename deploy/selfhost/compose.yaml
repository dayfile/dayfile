# Self-hosting with HTTPS: set DAYFILE_DOMAIN in .env next to this file, then
#   docker compose up -d
# Caddy obtains and renews the certificate. dayfile itself is not published on the host.
services:
  dayfile:
    build: ../..
    restart: unless-stopped
    volumes:
      - dayfile-data:/data
    environment:
      DAYFILE_AUTH_URI: ${DAYFILE_AUTH_URI:-}
  web:
    # The web view of this one log: sign in with a read token. It reaches the log only through the API.
    build: ../..
    restart: unless-stopped
    command: ["uvicorn", "dayfile.web:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
    environment:
      DAYFILE_SINGLE_LOG: "1"
      DAYFILE_API_URL: http://dayfile:8000
    depends_on: [dayfile]
  email:
    build: ../..
    restart: unless-stopped
    profiles: ["email"]          # docker compose --profile email up -d
    command: ["dayfile", "poll-email", "--folder", "SMS"]
    volumes:
      - dayfile-data:/data
    environment:
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
  notify:
    build: ../..
    restart: unless-stopped
    profiles: ["notify"]         # docker compose --profile notify up -d
    command: ["dayfile", "notify"]
    volumes:
      - dayfile-data:/data
    environment:
      NTFY_URL: ${NTFY_URL:-}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DAYFILE_DOMAIN: ${DAYFILE_DOMAIN:?set DAYFILE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [dayfile, web]
volumes:
  dayfile-data:
  caddy-data:
