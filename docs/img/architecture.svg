<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="dayfile architecture">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#56627d"/></marker>
  </defs>
  <rect width="1100" height="600" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2a4a">dayfile architecture</text>

  <!-- column headings -->
  <g font-size="12" font-weight="700" fill="#56627d" text-anchor="middle" letter-spacing="1">
    <text x="105" y="76">SOURCES</text><text x="333" y="76">INGEST</text><text x="560" y="76">THE LOG</text><text x="800" y="76">PROJECTION</text><text x="1005" y="76">VIEWS</text>
  </g>

  <!-- sources: anything that can POST an event; the adapters are optional and self-host only -->
  <g fill="#eef1f7" stroke="#dfe3ec">
    <rect x="30" y="92" width="150" height="48" rx="8"/><rect x="30" y="150" width="150" height="48" rx="8"/>
    <rect x="30" y="208" width="150" height="48" rx="8"/><rect x="30" y="266" width="150" height="48" rx="8"/>
  </g>
  <rect x="30" y="324" width="150" height="48" rx="8" fill="#ffffff" stroke="#56627d" stroke-dasharray="5 4"/>
  <g font-size="13" fill="#1b2a4a" text-anchor="middle">
    <text x="105" y="113">Anything that can POST</text><text x="105" y="129" font-size="11" fill="#56627d">script, webhook, device, agent</text>
    <text x="105" y="171">dayfile add</text><text x="105" y="187" font-size="11" fill="#56627d">CLI, direct or via a token</text>
    <text x="105" y="229">AI assistants</text><text x="105" y="245" font-size="11" fill="#56627d">MCP, with a write token</text>
    <text x="105" y="287">CloudEvents</text><text x="105" y="303" font-size="11" fill="#56627d">foreign systems</text>
    <text x="105" y="345">Optional adapters</text><text x="105" y="361" font-size="11" fill="#56627d">email (IMAP), generators</text>
  </g>

  <!-- ingest -->
  <rect x="255" y="92" width="156" height="280" rx="10" fill="#fff3dc" stroke="#f5a623"/>
  <g font-size="13" fill="#1b2a4a" text-anchor="middle">
    <text x="333" y="120" font-weight="700">Ingest core</text>
    <text x="333" y="150">validate (JSON Schema)</text>
    <text x="333" y="174">normalize timestamps</text>
    <text x="333" y="198">default audience = self</text>
    <text x="333" y="222">check signature</text>
    <text x="333" y="246">bind source + labels</text>
    <text x="333" y="270">to the write token</text>
    <text x="333" y="302">idempotent on</text>
    <text x="333" y="320">(source_id, source_ref)</text>
    <text x="333" y="352" font-size="11" fill="#56627d">one transaction per batch</text>
  </g>

  <!-- log -->
  <rect x="470" y="92" width="180" height="280" rx="10" fill="#1b2a4a"/>
  <g font-size="13" fill="#ffffff" text-anchor="middle">
    <text x="560" y="120" font-weight="700">SQLite event log</text>
    <text x="560" y="144" font-size="11" fill="#dfe3ec">append-only, triggers</text>
  </g>
  <g fill="#ffffff">
    <rect x="490" y="162" width="140" height="22" rx="5" fill-opacity="0.95"/><rect x="490" y="192" width="140" height="22" rx="5" fill-opacity="0.7"/>
    <rect x="490" y="222" width="140" height="22" rx="5" fill-opacity="0.5"/><rect x="490" y="252" width="140" height="22" rx="5" fill-opacity="0.3"/>
  </g>
  <g font-size="11" fill="#1b2a4a"><text x="500" y="177">seq 4  closes seq 2</text><text x="500" y="207">seq 3  note</text></g>
  <g font-size="11" fill="#ffffff"><text x="500" y="237">seq 2  tag: todo</text><text x="500" y="267">seq 1  tag: weather</text></g>
  <g font-size="11" fill="#dfe3ec" text-anchor="middle">
    <text x="560" y="304">events, tags, audience, refs</text>
    <text x="560" y="322">UTC timestamps, one format</text>
    <text x="560" y="340">cursor = seq, never time</text>
  </g>

  <!-- projection -->
  <rect x="690" y="92" width="220" height="280" rx="10" fill="#e6f3ec" stroke="#1d7a46"/>
  <g font-size="13" fill="#1b2a4a" text-anchor="middle">
    <text x="800" y="120" font-weight="700">Query and fold</text>
    <text x="800" y="150">authenticate credential</text>
    <text x="800" y="174">filter by audience labels</text>
    <text x="800" y="198">time release:</text>
    <text x="800" y="214" font-size="12">visible_at ≤ now ≤ expires_at</text>
    <text x="800" y="238">fold lifecycle edges</text>
    <text x="800" y="254" font-size="11">open, done, superseded, retracted</text>
    <text x="800" y="278">tag, status, within</text>
    <text x="800" y="302">page by seq</text>
    <text x="800" y="318" font-size="12">+ released_after cursor</text>
    <text x="800" y="352" font-size="11" fill="#56627d">Cache-Control: private, per-caller ETag</text>
  </g>

  <!-- views -->
  <g fill="#eef1f7" stroke="#dfe3ec"><rect x="950" y="120" width="110" height="46" rx="8"/><rect x="950" y="186" width="110" height="46" rx="8"/><rect x="950" y="252" width="110" height="46" rx="8"/></g>
  <g font-size="13" fill="#1b2a4a" text-anchor="middle"><text x="1005" y="148">JSON Feed</text><text x="1005" y="214">Atom</text><text x="1005" y="280">CloudEvents</text></g>

  <!-- arrows -->
  <g stroke="#56627d" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M182 232 H252"/><path d="M413 232 H467"/>
    <path d="M912 143 H947"/><path d="M912 209 H947"/><path d="M912 275 H947"/>
  </g>
  <path d="M688 232 H653" stroke="#56627d" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="670" y="224" font-size="10" fill="#56627d" text-anchor="middle">reads</text>
  <text x="332" y="224" font-size="10" fill="#56627d" text-anchor="middle" display="none">.</text>

  <!-- lower band -->
  <rect x="30" y="410" width="1040" height="150" rx="12" fill="#f7f8fc" stroke="#e1e5f0"/>
  <text x="50" y="436" font-size="12" font-weight="700" fill="#56627d" letter-spacing="1">AROUND THE LOG</text>

  <g font-size="13" fill="#1b2a4a">
    <rect x="50" y="452" width="300" height="90" rx="8" fill="#ffffff" stroke="#dfe3ec"/>
    <text x="64" y="476" font-weight="700">Tokens and keys</text>
    <text x="64" y="496" font-size="12">read tokens: audience labels, expiry, revoke</text>
    <text x="64" y="513" font-size="12">write tokens: allowed sources, rate limit</text>
    <text x="64" y="530" font-size="11" fill="#56627d">only sha256 stored; Ed25519 public keys</text>

    <rect x="370" y="452" width="340" height="90" rx="8" fill="#ffffff" stroke="#dfe3ec"/>
    <text x="384" y="476" font-weight="700">Consumers</text>
    <text x="384" y="496" font-size="12">feed readers and scripts poll a /t/&lt;token&gt;/ URL</text>
    <text x="384" y="513" font-size="12">followers resume with since_seq + released_after</text>
    <text x="384" y="530" font-size="11" fill="#56627d">log redacts tokens from access logs</text>

    <rect x="730" y="452" width="320" height="90" rx="8" fill="#ffffff" stroke="#56627d" stroke-dasharray="5 4"/>
    <text x="744" y="476" font-weight="700">Notifier (e.g. ntfy.sh)</text>
    <text x="744" y="496" font-size="12">pushes urgent events (urgency 2 or 3) once,</text>
    <text x="744" y="513" font-size="12">when they become visible; never replayed</text>
    <text x="744" y="530" font-size="11" fill="#56627d">optional adapter, self-host only</text>
  </g>
</svg>
