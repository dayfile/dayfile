<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="access control">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6785"/></marker></defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e2a47">One URL space, a different view per credential</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#5b6785">The audience comes from the token, never from the URL. Missing audience means "self".</text>

  <g font-size="11" font-weight="700" fill="#5b6785" letter-spacing="1"><text x="40" y="92">CREDENTIALS</text><text x="360" y="92">EVENTS IN THE LOG</text><text x="720" y="92">WHAT EACH SEES</text></g>

  <!-- tokens -->
  <g font-size="13" fill="#1e2a47">
    <rect x="40" y="106" width="260" height="62" rx="8" fill="#fff6e5" stroke="#f5a524"/><text x="56" y="128" font-weight="700">your token</text><text x="56" y="146" font-size="12">labels: self, family</text><text x="56" y="160" font-size="11" fill="#5b6785">Bearer header or /t/&lt;token&gt;/</text>
    <rect x="40" y="188" width="260" height="62" rx="8" fill="#fff6e5" stroke="#f5a524"/><text x="56" y="210" font-weight="700">partner's token</text><text x="56" y="228" font-size="12">labels: family</text><text x="56" y="242" font-size="11" fill="#5b6785">expires in 30 days, revocable</text>
    <rect x="40" y="270" width="260" height="62" rx="8" fill="#eef1f8" stroke="#8a96b8"/><text x="56" y="292" font-weight="700">phone app (write token)</text><text x="56" y="310" font-size="12">source: adapter:phone  labels: self</text><text x="56" y="324" font-size="11" fill="#5b6785">POST only, 600 events/min</text>
    <rect x="40" y="352" width="260" height="46" rx="8" fill="#fde8e8" stroke="#e08a8a"/><text x="56" y="373" font-weight="700">no or bad token</text><text x="56" y="389" font-size="12" fill="#5b6785">401, nothing revealed</text>
  </g>

  <!-- events -->
  <g font-size="13" fill="#1e2a47">
    <rect x="360" y="106" width="260" height="48" rx="8" fill="#eef1f8" stroke="#c4cbe0"/><text x="376" y="127" font-weight="700">Passport todo</text><text x="376" y="144" font-size="12" fill="#5b6785">audience: self</text>
    <rect x="360" y="170" width="260" height="48" rx="8" fill="#eef1f8" stroke="#c4cbe0"/><text x="376" y="191" font-weight="700">Dinner Friday</text><text x="376" y="208" font-size="12" fill="#5b6785">audience: self, family</text>
    <rect x="360" y="234" width="260" height="48" rx="8" fill="#eef1f8" stroke="#c4cbe0"/><text x="376" y="255" font-weight="700">Groceries</text><text x="376" y="272" font-size="12" fill="#5b6785">audience: family</text>
    <rect x="360" y="298" width="260" height="48" rx="8" fill="#eef1f8" stroke="#c4cbe0"/><text x="376" y="319" font-weight="700">Weather today</text><text x="376" y="336" font-size="12" fill="#5b6785">audience: self, family</text>
  </g>

  <!-- results -->
  <g font-size="13" fill="#1e2a47">
    <rect x="720" y="106" width="200" height="104" rx="8" fill="#eaf6ee" stroke="#7bc596"/><text x="736" y="128" font-weight="700">You</text><text x="736" y="148" font-size="12">Passport todo</text><text x="736" y="164" font-size="12">Dinner Friday</text><text x="736" y="180" font-size="12">Groceries</text><text x="736" y="196" font-size="12">Weather today</text>
    <rect x="720" y="226" width="200" height="88" rx="8" fill="#eaf6ee" stroke="#7bc596"/><text x="736" y="248" font-weight="700">Partner</text><text x="736" y="268" font-size="12">Dinner Friday</text><text x="736" y="284" font-size="12">Groceries</text><text x="736" y="300" font-size="12">Weather today</text>
    <rect x="720" y="330" width="200" height="68" rx="8" fill="#f1f1f1" stroke="#cfcfcf"/><text x="736" y="352" font-weight="700" fill="#5b6785">Phone app</text><text x="736" y="370" font-size="12" fill="#5b6785">cannot read feeds (403)</text><text x="736" y="386" font-size="12" fill="#5b6785">can add self-only events</text>
  </g>

  <g stroke="#5b6785" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M304 137 H356"/><path d="M624 252 H716"/></g>
  <text x="330" y="128" font-size="10" fill="#5b6785" text-anchor="middle">read</text><text x="670" y="244" font-size="10" fill="#5b6785" text-anchor="middle">labels ∩ audience</text>
</svg>
