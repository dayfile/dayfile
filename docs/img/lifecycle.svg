<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="how state changes are new events">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker></defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1e2a47">State changes are new events, never edits</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#5b6785">The log below only ever grows. The status column is computed when a feed is read.</text>

  <g font-size="11" font-weight="700" fill="#5b6785" letter-spacing="1"><text x="40" y="92">THE LOG (APPEND-ONLY)</text><text x="640" y="92">STATUS NOW</text></g>

  <g font-size="13" fill="#1e2a47">
    <rect x="40" y="104" width="480" height="48" rx="8" fill="#eef1f8" stroke="#c4cbe0"/><text x="56" y="125" font-weight="700">seq 1  todo</text><text x="56" y="142" font-size="12" fill="#5b6785">"Renew passport"</text>
    <rect x="40" y="174" width="480" height="48" rx="8" fill="#eef1f8" stroke="#c4cbe0"/><text x="56" y="195" font-weight="700">seq 2  todo.done</text><text x="56" y="212" font-size="12" fill="#5b6785">completes seq 1</text>
    <rect x="40" y="244" width="480" height="48" rx="8" fill="#eef1f8" stroke="#c4cbe0"/><text x="56" y="265" font-weight="700">seq 3  tombstone</text><text x="56" y="282" font-size="12" fill="#5b6785">retracts seq 2   ("marked done by mistake")</text>
    <rect x="40" y="314" width="480" height="48" rx="8" fill="#fff6e5" stroke="#f5a524" stroke-dasharray="5 4"/><text x="56" y="335" font-weight="700">seq 4  todo.done   visible_at: tomorrow 09:00</text><text x="56" y="352" font-size="12" fill="#5b6785">completes seq 1   (time-released, not in force yet)</text>
  </g>

  <!-- ref arrows -->
  <g stroke="#c2410c" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M530 198 C 565 198 565 128 524 128"/>
    <path d="M530 268 C 580 268 580 198 524 198"/>
    <path d="M530 338 C 600 338 600 128 524 128" stroke-dasharray="5 4"/>
  </g>

  <!-- states -->
  <g font-size="13" text-anchor="middle">
    <rect x="640" y="104" width="280" height="48" rx="8" fill="#eaf6ee" stroke="#7bc596"/><text x="780" y="125" font-weight="700" fill="#1e2a47">open</text><text x="780" y="142" font-size="12" fill="#5b6785">the completion was retracted: re-opened</text>
    <rect x="640" y="174" width="280" height="48" rx="8" fill="#fde8e8" stroke="#e08a8a"/><text x="780" y="195" font-weight="700" fill="#1e2a47">retracted</text><text x="780" y="212" font-size="12" fill="#5b6785">hidden by default</text>
    <rect x="640" y="244" width="280" height="48" rx="8" fill="#eaf6ee" stroke="#7bc596"/><text x="780" y="265" font-weight="700" fill="#1e2a47">open</text><text x="780" y="282" font-size="12" fill="#5b6785">a tombstone is itself an ordinary event</text>
    <rect x="640" y="314" width="280" height="48" rx="8" fill="#f1f1f1" stroke="#cfcfcf"/><text x="780" y="335" font-weight="700" fill="#5b6785">not visible yet</text><text x="780" y="352" font-size="12" fill="#5b6785">at 09:00 it completes seq 1 again</text>
  </g>
  <g font-size="11" fill="#5b6785"><text x="40" y="386">Precedence: retracted, done, superseded, open. An edge counts only while the event that carries it is not itself retracted.</text></g>
</svg>
