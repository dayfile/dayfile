# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing (no token):
# on pypi.org add this repository, workflow `publish.yml` and environment `pypi` as a trusted publisher.
name: publish
on:
  release:
    types: [published]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build
      - run: uv publish --trusted-publishing always
