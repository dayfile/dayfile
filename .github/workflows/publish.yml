# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing (no token):
# on pypi.org add this repository, workflow `publish.yml` and environment `pypi` as a trusted publisher.
name: publish
on:
  release:
    types: [published]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv build
      - run: uv publish --trusted-publishing always
