# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing (no token):
# on pypi.org add this repository, workflow `publish.yml` and environment `pypi` as a trusted publisher.
name: publish
on:
  release:
    types: [published]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - run: uv publish --trusted-publishing always
