# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing (no token):
# on pypi.org add this repository, workflow `publish.yml` and environment `pypi` as a trusted publisher.
name: publish
on:
  release:
    types: [published]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv build
      - run: uv publish --trusted-publishing always
